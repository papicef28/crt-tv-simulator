<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRT TV 2011 - Channel Simulator with YouTube</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
    <div class="crt-container">
        <!-- CRT TV Shell -->
        <div class="crt-tv">
            <!-- Screen Frame -->
            <div class="screen-frame">
                <div class="screen">
                    <div class="scanlines"></div>
                    <div class="screen-content">
                        <!-- Channel Display -->
                        <div class="channel-display" id="channelDisplay">
                            <div class="channel-info">
                                <span class="channel-number" id="channelNumber">1</span>
                                <span class="channel-name" id="channelName">BBC News</span>
                            </div>
                            <!-- YouTube Player Container -->
                            <div class="video-area" id="videoArea">
                                <div id="youtubePlayerContainer" style="width: 100%; height: 100%; position: relative;">
                                    <div id="youtubePlayer" style="width: 100%; height: 100%;"></div>
                                    <div id="noVideoMessage" style="display: none; width: 100%; height: 100%; background: linear-gradient(135deg, #333, #000); color: #00FF41; font-family: 'Courier New', monospace; justify-content: center; align-items: center; font-size: 18px; text-align: center; flex-direction: column; gap: 20px;">
                                        <div>📺 NO SIGNAL 📺</div>
                                        <div style="font-size: 14px; opacity: 0.7;">Video not available for this channel</div>
                                    </div>
                                </div>
                                <!-- Program Info Overlay -->
                                <div class="program-info">
                                    <div class="program-title" id="programTitle">Now Playing</div>
                                    <div class="program-time" id="programTime">Live Stream</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <!-- Power and Status Lights -->
                <div class="status-lights">
                    <div class="light power-light" id="powerLight"></div>
                    <span class="label">POWER</span>
                </div>

                <!-- Channel Controls -->
                <div class="channel-controls">
                    <button class="btn-channel" id="btnPrevChannel" title="Previous Channel">&lt;</button>
                    <div class="channel-display-small" id="channelDisplaySmall">001</div>
                    <button class="btn-channel" id="btnNextChannel" title="Next Channel">&gt;</button>
                </div>

                <!-- Volume Control -->
                <div class="volume-control">
                    <label for="volumeSlider">VOL</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50" class="slider">
                    <span id="volumeValue">50</span>
                </div>

                <!-- Brightness Control -->
                <div class="brightness-control">
                    <label for="brightnessSlider">BRIGHT</label>
                    <input type="range" id="brightnessSlider" min="0" max="100" value="100" class="slider">
                    <span id="brightnessValue">100</span>
                </div>

                <!-- Color Control -->
                <div class="color-control">
                    <label for="colorSlider">COLOR</label>
                    <input type="range" id="colorSlider" min="0" max="100" value="100" class="slider">
                    <span id="colorValue">100</span>
                </div>

                <!-- Direct Channel Input -->
                <div class="direct-input">
                    <input type="text" id="directChannelInput" placeholder="CH" maxlength="3" class="direct-input-field">
                    <button class="btn-go" id="btnGo">GO</button>
                </div>

                <!-- Main Controls -->
                <div class="main-controls">
                    <button class="btn-control power-btn" id="btnPower" title="Power">⏻ POWER</button>
                    <button class="btn-control" id="btnMenu" title="Menu">MENU</button>
                    <button class="btn-control" id="btnSettings" title="Settings">⚙ SETUP</button>
                    <button class="btn-control" id="btnMute" title="Mute">MUTE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Channel Guide Modal -->
    <div class="modal" id="channelGuideModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Channel Guide</h2>
                <button class="modal-close" id="closeChannelGuide">&times;</button>
            </div>
            <div class="modal-body">
                <div class="channel-list" id="channelList"></div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content settings-modal">
            <div class="modal-header">
                <h2>Channel Setup (Total: <span id="totalChannels">999</span> Channels)</h2>
                <button class="modal-close" id="closeSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="channel-list">Channel List</button>
                    <button class="tab-btn" data-tab="add-channel">Add Channel</button>
                    <button class="tab-btn" data-tab="reset">Reset</button>
                </div>

                <!-- Channel List Tab -->
                <div class="tab-content active" id="channel-list">
                    <div class="channel-settings-list" id="channelSettingsList"></div>
                </div>

                <!-- Add Channel Tab -->
                <div class="tab-content" id="add-channel">
                    <div class="add-channel-form">
                        <div class="form-group">
                            <label for="newChannelNumber">Channel Number:</label>
                            <input type="number" id="newChannelNumber" min="1" max="9999" placeholder="Enter channel number">
                        </div>
                        <div class="form-group">
                            <label for="newChannelName">Channel Name:</label>
                            <input type="text" id="newChannelName" placeholder="Enter channel name">
                        </div>
                        <div class="form-group">
                            <label for="newChannelColor">Color:</label>
                            <input type="color" id="newChannelColor" value="#00FF41">
                        </div>
                        <div class="form-group">
                            <label for="newChannelVideoId">YouTube Video ID (optional):</label>
                            <input type="text" id="newChannelVideoId" placeholder="Enter YouTube video ID">
                        </div>
                        <button class="btn-control" id="btnAddChannel">Add Channel</button>
                    </div>
                </div>

                <!-- Reset Tab -->
                <div class="tab-content" id="reset">
                    <div class="reset-options">
                        <p>Reset all channels to the default 999 channels configuration?</p>
                        <button class="btn-control btn-danger" id="btnResetChannels">Reset to Defaults</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Channel Modal -->
    <div class="modal" id="editChannelModal">
        <div class="modal-content edit-modal">
            <div class="modal-header">
                <h2>Edit Channel</h2>
                <button class="modal-close" id="closeEditChannel">&times;</button>
            </div>
            <div class="modal-body">
                <div class="edit-form">
                    <div class="form-group">
                        <label for="editChannelNumber">Channel Number:</label>
                        <input type="number" id="editChannelNumber" min="1" max="9999">
                    </div>
                    <div class="form-group">
                        <label for="editChannelName">Channel Name:</label>
                        <input type="text" id="editChannelName">
                    </div>
                    <div class="form-group">
                        <label for="editChannelColor">Color:</label>
                        <input type="color" id="editChannelColor">
                    </div>
                    <div class="form-group">
                        <label for="editChannelVideoId">YouTube Video ID:</label>
                        <input type="text" id="editChannelVideoId" placeholder="Enter YouTube video ID">
                    </div>
                    <div class="form-actions">
                        <button class="btn-control" id="btnSaveEdit">Save</button>
                        <button class="btn-control btn-secondary" id="btnCancelEdit">Cancel</button>
                        <button class="btn-control btn-danger" id="btnDeleteChannel">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Files -->
    <script src="js/channels.js"></script>
    <script src="js/channels-youtube.js"></script>
    <script src="js/youtube-player.js"></script>
    <script src="js/tv-controller.js"></script>
    <script src="js/channel-manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
